<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Generative Art Canvas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 16px; left: 16px;
    color: rgba(255,255,255,0.6);
    font: 12px/1.8 monospace;
    pointer-events: none;
    user-select: none;
  }
  #controls {
    position: fixed; top: 16px; right: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);
    padding: 6px 14px;
    font: 12px monospace;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.18); }
  #mode-label {
    position: fixed; bottom: 16px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font: 11px monospace;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div>粒子数: <span id="count">0</span></div>
  <div>モード: <span id="mode-name">流星</span></div>
  <div>クリック: モード切替</div>
</div>
<div id="controls">
  <button onclick="clearCanvas()">クリア</button>
  <button onclick="saveImage()">保存</button>
  <button onclick="toggleAuto()">自動: <span id="auto-label">OFF</span></button>
</div>
<div id="mode-label" id="mode-label">マウスを動かして描く</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Particle system ---
const particles = [];
let mouseX = W / 2, mouseY = H / 2;
let prevX = mouseX, prevY = mouseY;
let isDown = false;
let modeIndex = 0;
let autoMode = false;
let autoAngle = 0;
let frame = 0;

const MODES = [
  { name: '流星', color: () => `hsla(${200 + Math.random()*60},90%,70%,` },
  { name: '炎',   color: () => `hsla(${Math.random()*50},95%,${50+Math.random()*30}%,` },
  { name: '桜',   color: () => `hsla(${330 + Math.random()*30},80%,${70+Math.random()*20}%,` },
  { name: 'ネオン', color: () => `hsla(${Math.random()*360},100%,65%,` },
  { name: '深海',  color: () => `hsla(${180 + Math.random()*80},80%,${40+Math.random()*40}%,` },
];

class Particle {
  constructor(x, y, mode) {
    this.x = x;
    this.y = y;
    this.mode = mode;
    const speed = 0.5 + Math.random() * 3;
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;

    switch (mode) {
      case 0: // 流星: upward drift
        this.vy -= 2 + Math.random() * 2;
        this.vx += (Math.random() - 0.5) * 1;
        this.life = 0.9 + Math.random() * 0.1;
        this.decay = 0.012 + Math.random() * 0.015;
        this.size = 1.5 + Math.random() * 2.5;
        break;
      case 1: // 炎: upward + wobble
        this.vy = -(1 + Math.random() * 3);
        this.vx = (Math.random() - 0.5) * 2;
        this.life = 0.8 + Math.random() * 0.2;
        this.decay = 0.02 + Math.random() * 0.02;
        this.size = 2 + Math.random() * 4;
        break;
      case 2: // 桜: flutter fall
        this.vy = 0.3 + Math.random() * 1;
        this.vx = (Math.random() - 0.5) * 2;
        this.wobble = Math.random() * 0.1;
        this.wobbleT = Math.random() * Math.PI * 2;
        this.life = 1;
        this.decay = 0.005 + Math.random() * 0.01;
        this.size = 3 + Math.random() * 4;
        break;
      case 3: // ネオン: burst outward
        this.life = 1;
        this.decay = 0.025 + Math.random() * 0.02;
        this.size = 1 + Math.random() * 3;
        break;
      case 4: // 深海: slow drift
        this.vx *= 0.4;
        this.vy *= 0.4;
        this.vy -= 0.1 + Math.random() * 0.5;
        this.life = 1;
        this.decay = 0.006 + Math.random() * 0.01;
        this.size = 2 + Math.random() * 5;
        break;
    }
    this.colorFn = MODES[mode].color;
  }

  update() {
    if (this.mode === 2 && this.wobble !== undefined) {
      this.wobbleT += 0.05;
      this.vx += Math.sin(this.wobbleT) * this.wobble;
    }
    if (this.mode === 1) {
      this.vx += (Math.random() - 0.5) * 0.3;
      this.vy *= 0.98;
    }
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.99;
    this.life -= this.decay;
  }

  draw(ctx) {
    if (this.life <= 0) return;
    const alpha = Math.max(0, this.life);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
    ctx.fillStyle = this.colorFn() + alpha.toFixed(2) + ')';
    ctx.fill();
  }
}

function emit(x, y, count = 6) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, modeIndex));
  }
}

// --- Trail effect ---
function drawTrail(x1, y1, x2, y2) {
  const dist = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.max(1, Math.floor(dist / 8));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    emit(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, 4);
  }
}

// --- Animation loop ---
function loop() {
  requestAnimationFrame(loop);
  frame++;

  // Fade background
  ctx.fillStyle = 'rgba(10,10,15,0.18)';
  ctx.fillRect(0, 0, W, H);

  // Auto cursor
  if (autoMode) {
    autoAngle += 0.018;
    const r = Math.min(W, H) * 0.28;
    const cx = W / 2 + Math.cos(autoAngle * 1.3) * r;
    const cy = H / 2 + Math.sin(autoAngle) * r * 0.6;
    drawTrail(mouseX, mouseY, cx, cy);
    mouseX = cx; mouseY = cy;
  }

  // Update & draw
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  document.getElementById('count').textContent = particles.length;
}
loop();

// --- Input ---
canvas.addEventListener('mousemove', e => {
  if (autoMode) return;
  drawTrail(mouseX, mouseY, e.clientX, e.clientY);
  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  drawTrail(mouseX, mouseY, t.clientX, t.clientY);
  mouseX = t.clientX; mouseY = t.clientY;
}, { passive: false });

canvas.addEventListener('click', e => {
  modeIndex = (modeIndex + 1) % MODES.length;
  document.getElementById('mode-name').textContent = MODES[modeIndex].name;
  // burst on click
  for (let i = 0; i < 40; i++) emit(e.clientX, e.clientY, 1);
});

// --- Controls ---
function clearCanvas() {
  particles.length = 0;
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);
}

function saveImage() {
  const a = document.createElement('a');
  a.download = `art-${Date.now()}.png`;
  a.href = canvas.toDataURL();
  a.click();
}

function toggleAuto() {
  autoMode = !autoMode;
  document.getElementById('auto-label').textContent = autoMode ? 'ON' : 'OFF';
}

// Initial burst
setTimeout(() => emit(W / 2, H / 2, 30), 100);
</script>
</body>
</html>
